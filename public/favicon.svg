<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="230" cy="270" r="140"/>
    </clipPath>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Globe circle -->
  <circle cx="230" cy="270" r="140" fill="none" stroke="url(#globe)" stroke-width="14" opacity="0.95"/>
  <!-- Globe grid lines (clipped to globe) -->
  <g clip-path="url(#globeClip)" opacity="0.45" stroke="url(#globe)" fill="none">
    <!-- Central meridian -->
    <ellipse cx="230" cy="270" rx="55" ry="140" stroke-width="8"/>
    <!-- Second meridian -->
    <ellipse cx="230" cy="270" rx="110" ry="140" stroke-width="6"/>
    <!-- Latitude lines -->
    <line x1="90" y1="220" x2="370" y2="220" stroke-width="7" stroke-linecap="round"/>
    <line x1="90" y1="270" x2="370" y2="270" stroke-width="8" stroke-linecap="round"/>
    <line x1="90" y1="320" x2="370" y2="320" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- Speech bubble -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="130" height="86" rx="24" fill="url(#bubble)"/>
    <polygon points="20,86 42,114 56,86" fill="url(#bubble)"/>
    <!-- Three dots -->
    <circle cx="38" cy="43" r="10" fill="white" opacity="0.92"/>
    <circle cx="65" cy="43" r="10" fill="white" opacity="0.92"/>
    <circle cx="92" cy="43" r="10" fill="white" opacity="0.92"/>
  </g>
  <!-- Subtle shine overlay -->
  <rect width="512" height="512" rx="108" fill="url(#shine)"/>
</svg>
