<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2744"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Globe -->
  <circle cx="240" cy="275" r="145" fill="none" stroke="url(#accent)" stroke-width="13" opacity="0.9"/>
  <!-- Meridian vertical -->
  <ellipse cx="240" cy="275" rx="65" ry="145" fill="none" stroke="url(#accent)" stroke-width="9" opacity="0.55"/>
  <!-- Second meridian -->
  <ellipse cx="240" cy="275" rx="115" ry="145" fill="none" stroke="url(#accent)" stroke-width="7" opacity="0.3"/>
  <!-- Latitudes -->
  <line x1="95" y1="225" x2="385" y2="225" stroke="url(#accent)" stroke-width="7" opacity="0.4" stroke-linecap="round"/>
  <line x1="95" y1="275" x2="385" y2="275" stroke="url(#accent)" stroke-width="9" opacity="0.55" stroke-linecap="round"/>
  <line x1="95" y1="325" x2="385" y2="325" stroke="url(#accent)" stroke-width="7" opacity="0.4" stroke-linecap="round"/>
  <!-- Speech bubble -->
  <g transform="translate(330, 85)">
    <rect x="0" y="0" width="120" height="80" rx="22" fill="#818cf8"/>
    <polygon points="22,80 40,105 55,80" fill="#818cf8"/>
    <circle cx="35" cy="40" r="9" fill="white" opacity="0.95"/>
    <circle cx="60" cy="40" r="9" fill="white" opacity="0.95"/>
    <circle cx="85" cy="40" r="9" fill="white" opacity="0.95"/>
  </g>
  <!-- Shine -->
  <rect width="512" height="512" rx="110" fill="url(#shine)"/>
</svg>
